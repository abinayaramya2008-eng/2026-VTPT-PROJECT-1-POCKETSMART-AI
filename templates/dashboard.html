{% extends "base.html" %}
{% block content %}
<section class="section">
  <div class="container">
    <div class="dashboard-grid">
      <aside class="card side">
        <p class="muted">Signed in as</p><strong data-user-name>Loading...</strong>
        <nav style="margin-top:18px">
          <a href="/planner/home">Home Planner</a>
          <a href="/planner/party">Party Planner</a>
          <a href="/planner/jewelry">Jewelry Planner</a>
          <a href="/history">Recommendation History</a>
        </nav>
      </aside>
      <section class="card content-card">
        <span class="kicker">Dashboard</span>
        <h2>Your recent plans</h2>
        <div id="recent" class="recommendation-list"><div class="empty">Loading...</div></div>
      </section>
    </div>
  </div>
</section>
<script>
(async()=>{
  try {
    await requireAuth();
    const data = await api('/api/session-data');
    const target = document.getElementById('recent');
    const rows = data.data.recent_recommendations || [];
    target.innerHTML = rows.length ? rows.map(r => `<article class="reco"><span class="badge">${r.planner}</span><h3>${escapeHtml(r.title)}</h3><p class="muted">Budget ${money(r.budget)} • Estimated ${money(r.estimated_total)}</p><a class="btn secondary" href="/recommendations">View recommendation area</a></article>`).join('') : '<div class="empty">No recommendations yet. Start with a planner.</div>';
  } catch(err) { showError(err.message); }
})();
</script>
{% endblock %}
