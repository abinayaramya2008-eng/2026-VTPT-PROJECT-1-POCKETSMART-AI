{% extends "base.html" %}
{% block content %}
<section class="form-wrap">
  <div class="card form-card">
    <span class="kicker">Welcome back</span>
    <h2>Log in to PocketSmart AI</h2>
    <form id="loginForm">
      <div class="form-grid">
        <div class="field full"><label>Email</label><input name="email" type="email" required></div>
        <div class="field full"><label>Password</label><input name="password" type="password" minlength="8" required></div>
      </div>
      <div class="actions"><button class="btn" type="submit">Log in</button><a class="btn secondary" href="/register">Create account</a></div>
      <div class="alert" id="alert"></div>
    </form>
  </div>
</section>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = new FormData(e.target);
  try { await api('/api/auth/login', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(Object.fromEntries(form))}); window.location.href='/dashboard'; }
  catch (err) { showError(err.message); }
});
</script>
{% endblock %}
